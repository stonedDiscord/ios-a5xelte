name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (HEROLTE = Galaxy S7, A5XELTE, SWEET)
        default: HEROLTE
      board_profile:
        description: Patch profile (dreamlte = minimal S8 early bring-up)
        type: choice
        options: [herolte, dreamlte, a03]
        default: herolte
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      a03_ios_userspace:
        description: Experimental A03 XML entitlements and platform-binary support
        type: boolean
        default: false
      runner:
        description: Supported GitHub runner image (macOS 14 retired 2026-11-02)
        type: choice
        options: [macos-15-intel, macos-15, macos-26-intel, macos-26, xcode-27]
        default: macos-15-intel
      upload_buildtree:
        description: Upload the large patched build tree for local debugging
        type: boolean
        default: false
  push:
    branches: [main, herolte, codex/a5xelte-bringup]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  # Isolate runner pools so a stuck host cannot block a different runner.
  group: xnu-${{ github.ref }}-${{ inputs.runner || 'macos-15-intel' }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  # Target architecture is independent of the macOS runner's host CPU.
  ARCH_CONFIG: ARM64
  MACHINE_CONFIG: ${{ inputs.machine_config || 'HEROLTE' }}
  BOARD_PROFILE: ${{ inputs.board_profile || 'herolte' }}
  A03_IOS_USERSPACE: ${{ inputs.a03_ios_userspace || 'false' }}

jobs:
  build:
    # macOS 14 was retired on 2026-11-02; pin supported runner labels.
    # Newer iig emits IORPC.kernelContent, which 0083 adds to this xnu.
    # Each runner uploads its own artifacts (xnu-kernel-<runner>).
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner && format('["{0}"]', inputs.runner) || '["macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned XNU build checkout
        uses: actions/cache/restore@v4
        id: dxb-cache
        with:
          path: dxb
          key: xnu-dxb-v1-${{ env.DXB_SHA }}

      - name: Fetch build script
        run: |
          if [ -d dxb/.git ]; then
            git -C dxb reset --hard -q
            git -C dxb clean -fdq
            git -C dxb checkout -q --detach "$DXB_SHA" 2>/dev/null || {
              git -C dxb fetch -q --depth 1 origin "$DXB_SHA"
              git -C dxb checkout -q --detach "$DXB_SHA"
            }
          else
            git init -q dxb
            git -C dxb remote add origin "$DXB_REPO"
            git -C dxb fetch -q --depth 1 origin "$DXB_SHA"
            git -C dxb checkout -q --detach "$DXB_SHA"
          fi
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          if [ "$BOARD_PROFILE" = a03 ]; then
            [ "$MACHINE_CONFIG" = SWEET ] || { echo 'a03 requires native 16K SWEET config'; exit 1; }
            profile_flags=()
            if [ "$A03_IOS_USERSPACE" = true ]; then profile_flags+=(--ios-userspace); fi
            python3 tools/a03-build-profile.py a03-patches "${profile_flags[@]}"
            cp a03-patches/*.patch a03-patches/*.sh dxb/patches/
          elif [ "$BOARD_PROFILE" = dreamlte ]; then
            [ "$MACHINE_CONFIG" = HEROLTE ] || { echo 'dreamlte requires HEROLTE config'; exit 1; }
            python3 tools/dreamlte-build-profile.py dreamlte-patches
            cp dreamlte-patches/*.patch dreamlte-patches/*.sh dxb/patches/
          else
            cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          fi
          # libfirehose_kernel is built arm64e-only; these kernels are plain arm64.
          # Cortex-A53 boards (A5XELTE, HEROLTE) also need it without ARMv8.1
          # LSE atomics: same flags as tools/a5xelte-build-firehose.sh.
          python3 - dxb/build.sh "$MACHINE_CONFIG" <<'PY'
          import sys
          from pathlib import Path
          path, config = Path(sys.argv[1]), sys.argv[2]
          old = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          if config in ('A5XELTE', 'HEROLTE'):
              new = ('ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc '
                     '-Wno-packed -mcpu=cortex-a53 -march=armv8-a+crypto"')
          else:
              new = 'ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"'
          text = path.read_text()
          assert text.count(old) == 1, 'darwin-xnu-build firehose line changed'
          path.write_text(text.replace(old, new))
          print('firehose:', new)
          PY
          ls dxb/patches

      - name: Cache pinned XNU build checkout
        if: steps.dxb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dxb
          key: ${{ steps.dxb-cache.outputs.cache-primary-key }}

      - name: Deps
        run: |
          for formula in jq gum bash cmake ninja ccache zstd; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          # Prefer 15.x where installed, otherwise the oldest available.
          # An absent Xcode_15 glob must not abort this step under pipefail.
          XC=$(python3 - <<'PYXCODE'
          import re
          from pathlib import Path
          apps = list(Path('/Applications').glob('Xcode*.app'))
          if not apps:
              raise SystemExit('No Xcode application installed on this runner')
          def version(path):
              return tuple(int(x) for x in re.findall(r'[0-9]+', path.name)) or (999,)
          preferred = [p for p in apps if version(p)[0] == 15]
          print(sorted(preferred or apps, key=lambda p: (version(p), p.name))[
              -1 if preferred else 0])
          PYXCODE
          )
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Identify compiler cache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE=ccache" >> "$GITHUB_ENV"
          fingerprint=$(xcrun clang --version | shasum -a 256 | cut -c1-16)
          echo "A03_CCACHE_COMPILER=$fingerprint" >> "$GITHUB_ENV"
          ccache --max-size 5G
          ccache --zero-stats

      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .ccache
          key: xnu-ccache-v1-${{ matrix.runner }}-${{ env.A03_CCACHE_COMPILER }}-${{ env.BOARD_PROFILE }}-${{ env.KERNEL_CONFIG }}-${{ github.sha }}
          restore-keys: |
            xnu-ccache-v1-${{ matrix.runner }}-${{ env.A03_CCACHE_COMPILER }}-${{ env.BOARD_PROFILE }}-${{ env.KERNEL_CONFIG }}-

      - name: Restore KDK archive
        # The A03/iOS 16 path uses 13.5/22G74. Other MACOS_VERSION choices
        # fall back to darwin-xnu-build's normal KDK download path.
        uses: actions/cache/restore@v4
        id: kdk-cache
        with:
          path: .kdk-cache
          key: xnu-kdk-v1-${{ env.MACOS_VERSION }}-${{ matrix.runner }}

      - name: Install cached Kernel Debug Kit
        # The existing archive cache is truncated on the runner; let
        # darwin-xnu-build perform its normal KDK download/install instead.
        if: ${{ false }}
        run: |
          archive=.kdk-cache/KDK_13.5_22G74.tar.zst
          if test -f "$archive" && zstd -t "$archive" >/dev/null 2>&1; then
            sudo mkdir -p /Library/Developer/KDKs
            sudo tar --use-compress-program=zstd -xf "$archive" -C /Library/Developer/KDKs
          else
            echo 'Cached KDK archive is invalid; allowing build.sh to fetch a fresh KDK'
          fi

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          export MAKEFLAGS="${MAKEFLAGS} -j$(sysctl -n hw.ncpu)"
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Archive installed KDK for future runs
        if: success() && steps.kdk-cache.outputs.cache-hit != 'true' && env.MACOS_VERSION == '13.5'
        run: |
          mkdir -p .kdk-cache
          sudo tar --use-compress-program=zstd -cf .kdk-cache/KDK_13.5_22G74.tar.zst \
            -C /Library/Developer/KDKs KDK_13.5_22G74.kdk

      - name: Save KDK cache
        if: success() && steps.kdk-cache.outputs.cache-hit != 'true' && env.MACOS_VERSION == '13.5'
        uses: actions/cache/save@v4
        with:
          path: .kdk-cache
          key: ${{ steps.kdk-cache.outputs.cache-primary-key }}

      - name: Verify requested A03 USB probe is linked
        if: success() && inputs.board_profile == 'a03' && inputs.a03_ios_userspace
        run: |
          kernel="dxb/fakeroot/System/Library/Kernels/kernel.$(echo "$KERNEL_CONFIG" | tr A-Z a-z).$(echo "$MACHINE_CONFIG" | tr A-Z a-z)"
          test -f "$kernel"
          if ! strings "$kernel" | grep -F 'A03 USB: AON' >/dev/null; then
            echo 'A03 USB probe was requested but its diagnostic string is absent from the kernel' >&2
            exit 1
          fi
          if ! strings "$kernel" | grep -F 'A03 CATALOG direct' >/dev/null; then
            echo 'A03 direct catalog probe was requested but its diagnostic string is absent from the kernel' >&2
            exit 1
          fi
          if ! strings "$kernel" | grep -F 'A03 USERDATA root requested but validated storage unavailable' >/dev/null; then
            echo 'A03 USERDATA root selection was requested but its panic guard is absent from the kernel' >&2
            exit 1
          fi
          if ! strings "$kernel" | grep -F 'A03: validated USERDATA root mounted unsealed' >/dev/null; then
            echo 'A03 scoped unsealed-root support is absent from the kernel' >&2
            exit 1
          fi
          echo "A03 USB state probe linked: $kernel"

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

      - uses: actions/cache/save@v4
        if: success() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # Logs need a GitHub sign-in to read; check-run annotations are public.
      # Publish the first errors and the log tail so failures can be read
      # through the API (repos/.../check-runs/<job>/annotations).
      - name: Report build errors as annotations
        if: always()
        run: |
          test -f build.log || exit 0
          kernel="dxb/fakeroot/System/Library/Kernels/kernel.$(echo "$KERNEL_CONFIG" | tr A-Z a-z).$(echo "$MACHINE_CONFIG" | tr A-Z a-z)"
          if [ -f "$kernel" ]; then echo "kernel built: $kernel"; exit 0; fi
          python3 - build.log <<'PY'
          import re, sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          clean = [re.sub(r'\x1b\[[0-9;]*m', '', l) for l in lines]
          pat = re.compile(r'(error:|fatal error|Error \d|\*\*\* |FAILED|Skipping patch|No such file|panic|❌)', re.I)
          # Compiler/linker errors first: blacktop's known patch-skip lines
          # come first in the log and used to fill every annotation.
          # (Not "ld: warning": dtrace's libelf version warnings filled every
          # annotation and hid the real error, run 47.)
          cc = re.compile(r'(:\d+:\d+: (fatal )?error:|^ld: (?!warning)|Undefined symbols|clang: error|^make.*Error)')
          hits = [l for l in clean if cc.search(l)]
          # The lines around each compiler error (annotations hold 4 KiB).
          for i, l in enumerate(clean):
              if re.search(r':\d+:\d+: (fatal )?error:', l) and len(hits) < 40:
                  hits.append('CONTEXT ' + ' | '.join(x[:200] for x in clean[i:i + 4]))
          hits += [l for l in clean if pat.search(l) and l not in hits and 'Skipping patch' not in l
                   and 'already exists in working directory' not in l and 'patch does not apply' not in l]
          esc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          for l in hits[:9]:
              print('::error title=build::' + esc(l[:900]))
          tail = '\n'.join(l[:300] for l in clean[-60:])
          print('::error title=build log tail::' + esc(tail[-30000:]))
          PY
          exit 1

      - name: Package build tree for local compiles
        if: always() && (inputs.upload_buildtree || failure())
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always() && (inputs.upload_buildtree || failure())
        with:
          name: xnu-buildtree-${{ matrix.runner }}
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          kernel="out/kernel.$(echo "$KERNEL_CONFIG" | tr A-Z a-z).$(echo "$MACHINE_CONFIG" | tr A-Z a-z)"
          if [ -f "$kernel" ]; then
            file "$kernel"
            # SWEET/A03 requires plain ARM64, without arm64e/PAC or x86 slices.
            if [ "$MACHINE_CONFIG" = SWEET ]; then
              [ "$(lipo -archs "$kernel")" = arm64 ] || exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-${{ matrix.runner }}
          path: out/
          if-no-files-found: warn

      - name: Check Cortex-A53 compatibility (no ARMv8.1 LSE atomics)
        if: env.MACHINE_CONFIG == 'A5XELTE' || env.MACHINE_CONFIG == 'HEROLTE'
        run: |
          kernel="out/kernel.$(echo "$KERNEL_CONFIG" | tr A-Z a-z).$(echo "$MACHINE_CONFIG" | tr A-Z a-z)"
          test -f "$kernel"
          xcrun llvm-objdump -d --no-show-raw-insn "$kernel" > lse-scan.txt || {
            echo "::error title=LSE check::llvm-objdump failed on $kernel"; exit 1; }
          # Fails only on LSE inside code; constant tables in __TEXT that
          # disassemble as LSE (K256, SHA-256 round constants) are data.
          python3 - lse-scan.txt "$kernel" <<'PY'
          import re, sys
          lse = re.compile(r'\s(cas|casp|ldadd|ldclr|ldeor|ldset|ldsmax|ldsmin|ldumax|ldumin|stadd|stclr|steor|stset|stsmax|stsmin|stumax|stumin|swp)[a-z]*\s')
          data_symbols = {'K256'}
          func, funcs, samples = '?', {}, []
          for line in open(sys.argv[1], errors='replace'):
              m = re.match(r'^[0-9a-f]+ <(.+)>:', line)
              if m:
                  func = m.group(1)
              elif lse.search(line) and func not in data_symbols:
                  funcs[func] = funcs.get(func, 0) + 1
                  if len(samples) < 8:
                      samples.append(func + ': ' + line.strip())
          count = sum(funcs.values())
          print(f'LSE instructions in code of {sys.argv[2]}: {count}')
          if count:
              top = sorted(funcs.items(), key=lambda kv: -kv[1])[:40]
              msg = f'{count} LSE instructions in {len(funcs)} functions\n'
              msg += '\n'.join(f'{n} {f}' for f, n in top) + '\n--\n' + '\n'.join(samples)
              print('::error title=LSE in kernel::' + msg.replace('%', '%25').replace('\n', '%0A'))
              sys.exit(1)
          PY
