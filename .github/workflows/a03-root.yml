name: a03-root
on:
  workflow_dispatch:
    inputs:
      storage_probe:
        description: Add read-only A03 BOOT raw/block PID1 checks
        type: boolean
        default: false
      catalog_probe:
        description: Add read-only USERDATA catalog-sector PID1 check
        type: boolean
        default: false
      userdata_write_probe:
        description: Save/change/readback/restore USERDATA sector at16GiB (requires rw kernel)
        type: boolean
        default: false
  push:
    branches: [a03-bringup]
    paths: [tools/a03-build-hfs-root.sh, tools/sweet-init.S, tools/a03-storage-test.inc, tools/a03-storage-write-test.inc, tools/a03-catalog-test.inc, tools/mkinit.py, a03-root/**, .github/workflows/a03-root.yml]
concurrency:
  group: a03-root
  cancel-in-progress: true
jobs:
  root:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone test root
        env:
          USERDATA_WRITE_PROBE: ${{ inputs.userdata_write_probe || 'false' }}
          STORAGE_PROBE: ${{ inputs.storage_probe || 'false' }}
          CATALOG_PROBE: ${{ inputs.catalog_probe || 'false' }}
        run: |
          mkdir -p out root/sbin root/dev root/private/var/tmp
          flags=()
          if [ "$STORAGE_PROBE" = true ]; then flags+=(-DA03_STORAGE_TEST); fi
          if [ "$CATALOG_PROBE" = true ]; then flags+=(-DA03_CATALOG_TEST); fi
          if [ "$USERDATA_WRITE_PROBE" = true ]; then flags+=(-DA03_STORAGE_TEST -DA03_STORAGE_WRITE_TEST); fi
          xcrun clang -target arm64-apple-ios16.0 "${flags[@]}" -c tools/sweet-init.S -o out/init.o
          python3 tools/mkinit.py out/init.o root/sbin/launchd
          if [ -d a03-root ]; then ditto a03-root root; fi
          bash tools/a03-build-hfs-root.sh root out/a03-test-root.img
          (cd out && shasum -a 256 a03-test-root.img > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: a03-hfs-test-root
          path: |
            out/a03-test-root.img
            out/SHA256SUMS
