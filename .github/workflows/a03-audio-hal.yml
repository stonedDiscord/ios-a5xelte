name: a03-audio-hal

on:
  workflow_dispatch:
  push:
    branches: [a03-bringup]
    paths:
      - 'gpu/hakios-audio/**'
      - '.github/workflows/a03-audio-hal.yml'

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the iOS HAL bundle
        run: |
          set -euo pipefail
          bundle=out/HakiosAudio.driver
          bash gpu/hakios-audio/build-ios.sh "$bundle"
          test "$(xcrun lipo "$bundle/HakiosAudio" -archs)" = arm64
          xcrun vtool -show-build "$bundle/HakiosAudio" | tee out/build-version.txt
          grep -Eq 'platform[[:space:]]+IOS$' out/build-version.txt
          grep -Eq 'minos[[:space:]]+16\.0$' out/build-version.txt
          xcrun nm -gjU "$bundle/HakiosAudio" | grep -x _HakiosAudio_Create
          (cd out && shasum -a 256 HakiosAudio.driver/* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: a03-audio-hal
          path: out/
