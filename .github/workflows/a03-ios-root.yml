name: a03-ios-root
on:
  workflow_dispatch:
    inputs:
      speaker_audio:
        description: Include the A03 speaker HAL and VirtualAudio routing
        type: boolean
        default: false
  push:
    branches: [a03-bringup]
    paths: [.github/workflows/a03-ios-root.yml, tools/a03-build-ios-root-macos.sh, tools/sweet-root-tweaks.py, tools/a03-stage-wallpaper-catalog.py]
concurrency:
  group: a03-ios-root
  cancel-in-progress: false
jobs:
  root:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned plain-arm64 iOS 16 source
        run: |
          mkdir -p research/ipsw out
          curl --fail --location --retry 3 --output research/ipsw/source.ipsw https://updates.cdn-apple.com/2022FallFCS/fullrestores/012-65861/0A0400A0-2174-4D49-91B7-43FC9DE24272/iPhone10,3,iPhone10,6_16.0_20A362_Restore.ipsw
      - name: Build the iOS speaker HAL
        if: inputs.speaker_audio
        run: bash gpu/hakios-audio/build-ios.sh out/HakiosAudio.driver
      - name: Stage and verify journaled HFSX root
        env:
          SPEAKER_AUDIO: ${{ inputs.speaker_audio || 'false' }}
        run: |
          args=(research/ipsw/source.ipsw out/a03-ios16-root.img)
          if [[ "$SPEAKER_AUDIO" == true ]]; then
            args+=(out/HakiosAudio.driver)
          fi
          bash tools/a03-build-ios-root-macos.sh "${args[@]}"
      - name: Compress root for transfer
        if: ${{ always() }}
        run: |
          if [ -f out/a03-ios16-root.img ]; then gzip -1 out/a03-ios16-root.img; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: a03-ios16-hfs-root
          retention-days: 1
          compression-level: 0
          path: |
            out/a03-ios16-root.img.gz
            out/a03-ios16-root.img.sha256
            out/a03-ios16-root.img.inventory.json
